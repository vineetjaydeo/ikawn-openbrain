app = "fedfina-openbrain"
primary_region = "sin"

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 25

  [http_service.http_options]
    idle_timeout = 300
    response_header_timeout = 300

[[vm]]
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
