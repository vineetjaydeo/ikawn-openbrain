app = "ikawn-openbrain-db"
primary_region = "sin"

[build]

[mounts]
  source = "pg_data"
  destination = "/data"

[checks]
  [checks.pg]
    type = "tcp"
    port = 5432
    interval = "15s"
    timeout = "5s"

[[services]]
  internal_port = 5432
  protocol = "tcp"

  [[services.ports]]
    port = 5432
    handlers = ["pg_tls"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
